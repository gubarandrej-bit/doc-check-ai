# nginx в контейнере фронтенда: отдаёт собранную статику интерфейса и
# проксирует запросы к бэкенду.
#
# Зачем это нужно. При разработке проксирование /api выполняет сам Vite
# (vite.config.js -> server.proxy), поэтому отдельный обратный прокси не нужен.
# Но в рабочем режиме контейнер отдаёт уже собранные файлы статикой, и запросы
# вида /api/* ушли бы в файловую систему и вернули 404. Этот конфиг
# восстанавливает единую точку входа: браузер обращается к одному адресу,
# а nginx решает, отдать ли файл интерфейса или передать запрос в бэкенд.

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Стандартного лимита в 1 МБ не хватает: загружаются xls, doc, pdf, dwg,
    # а запросы к моделям ИИ могут идти долго.
    client_max_body_size 512m;
    client_body_timeout  300s;

    gzip             on;
    gzip_types       text/plain text/css application/javascript application/json image/svg+xy;
    gzip_min_length  1024;

    # Интерфейс: любые неизвестные пути отдаём index.html,
    # иначе переход по прямой ссылке внутри SPA даст 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Обращения к бэкенду. proxy_pass без завершающего пути передаёт
    # исходный URI без изменений, поэтому "/api/auth/login" доедет
    # до "/api/auth/login" на бэкенде как есть.
    location /api {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Анализ документа нейросетью идёт минутами — стандартные 60 секунд
        # обрывали бы соединение на живом, но долгом запросе.
        proxy_connect_timeout 30s;
        proxy_send_timeout    900s;
        proxy_read_timeout    900s;
    }

    # Загруженные файлы и файлы отчётов.
    location /static {
        proxy_pass       http://backend:8000;
        proxy_set_header Host $host;
    }

    # Проверка живости бэкенда через тот же адрес.
    location = /health {
        proxy_pass       http://backend:8000;
        proxy_set_header Host $host;
    }
}